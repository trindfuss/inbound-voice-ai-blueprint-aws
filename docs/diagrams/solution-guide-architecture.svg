<text class="ink" x="132" y="256" text-anchor="middle" font-weight="600">ConversationRelay</text>
<text class="quiet" x="132" y="272" text-anchor="middle" font-size="11.5">Deepgram speech to text</text>
<text class="quiet" x="132" y="288" text-anchor="middle" font-size="11.5">ElevenLabs text to speech</text>
