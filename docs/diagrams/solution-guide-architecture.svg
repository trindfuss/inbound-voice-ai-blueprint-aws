<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 712" role="img" aria-label="Scripted steps run in the front door, the AI conversation in the bridge" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<title>Scripted steps run in the front door, the AI conversation in the bridge</title>
<style>.bg{fill:#ffffff}.ink{fill:#1f2328}.quiet{fill:#59636e}.edge{stroke:#8c959f}.head{fill:#8c959f}.accent{stroke:#0969da;fill:#0969da;fill-opacity:.12}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.ink{fill:#e6edf3}.quiet{fill:#9198a1}.edge{stroke:#6e7681}.head{fill:#6e7681}.accent{stroke:#4493f8;fill:#4493f8;fill-opacity:.18}}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
