<text class="ink" x="384" y="256" text-anchor="middle" font-weight="600">Front door Lambda</text>
<text class="ink" x="384" y="272" text-anchor="middle" font-size="11.5">scripted IVR and step-up</text>
<text class="ink" x="384" y="288" text-anchor="middle" font-size="11.5">confirmations, escalation</text>
<rect class="edge" fill="none" stroke-width="1.25" x="280" y="320" width="208" height="56" rx="8"/>
<text class="ink" x="384" y="344" text-anchor="middle" font-weight="600">Auth service Lambda</text>
<text class="quiet" x="384" y="360" text-anchor="middle" font-size="11.5">factors, token, Verify code</text>
<rect class="edge" fill="none" stroke-width="1.25" x="280" y="392" width="208" height="56" rx="8"/>
<text class="ink" x="384" y="416" text-anchor="middle" font-weight="600">CloudFront, ALB, WAF</text>
<text class="quiet" x="384" y="432" text-anchor="middle" font-size="11.5">WebSocket edge</text>
<rect class="accent" stroke-width="2" x="280" y="464" width="208" height="72" rx="8"/>
<text class="ink" x="384" y="488" text-anchor="middle" font-weight="600">TAC bridge (Fargate)</text>
<text class="ink" x="384" y="504" text-anchor="middle" font-size="11.5">Strands agent loop</text>
<text class="ink" x="384" y="520" text-anchor="middle" font-size="11.5">masking, silence watch</text>
<rect class="edge" fill="none" stroke-width="1.25" x="280" y="552" width="208" height="56" rx="8"/>
<text class="ink" x="384" y="576" text-anchor="middle" font-weight="600">Context API Lambda</text>
<text class="quiet" x="384" y="592" text-anchor="middle" font-size="11.5">call timeline for Flex</text>
<rect class="edge" fill="none" stroke-width="1.25" x="512" y="160" width="208" height="56" rx="8"/>
<text class="ink" x="616" y="184" text-anchor="middle" font-weight="600">Bedrock: Claude Haiku</text>
<text class="quiet" x="616" y="200" text-anchor="middle" font-size="11.5">agent model, slot resolver</text>
<rect class="edge" fill="none" stroke-width="1.25" x="512" y="232" width="208" height="56" rx="8"/>
<text class="ink" x="616" y="256" text-anchor="middle" font-weight="600">AgentCore Memory</text>
<text class="quiet" x="616" y="272" text-anchor="middle" font-size="11.5">the call history</text>
<rect class="edge" fill="none" stroke-width="1.25" x="512" y="304" width="208" height="56" rx="8"/>
<text class="ink" x="616" y="328" text-anchor="middle" font-weight="600">AgentCore Gateway</text>
<text class="quiet" x="616" y="344" text-anchor="middle" font-size="11.5">FAQ, branch hours (MCP)</text>
<rect class="edge" fill="none" stroke-width="1.25" x="512" y="376" width="208" height="56" rx="8"/>
<text class="ink" x="616" y="400" text-anchor="middle" font-weight="600">Bank tools Lambda</text>
<text class="quiet" x="616" y="416" text-anchor="middle" font-size="11.5">token checked on every call</text>
<rect class="edge" fill="none" stroke-width="1.25" x="512" y="448" width="208" height="88" rx="8"/>
<text class="ink" x="616" y="472" text-anchor="middle" font-weight="600">DynamoDB, KMS, secrets</text>
<text class="quiet" x="616" y="488" text-anchor="middle" font-size="11.5">call state, policy, catalog</text>
<text class="quiet" x="616" y="504" text-anchor="middle" font-size="11.5">token sealing, Twilio keys</text>
<text class="quiet" x="616" y="520" text-anchor="middle" font-size="11.5">Comprehend PII masking</text>
<rect class="edge" fill="none" stroke-width="1.25" x="512" y="552" width="208" height="56" rx="8"/>
<text class="ink" x="616" y="576" text-anchor="middle" font-weight="600">Admin console</text>
<text class="quiet" x="616" y="592" text-anchor="middle" font-size="11.5">Cognito, audited edits</text>
<text class="quiet" x="24" y="652" font-size="11.5">Webhooks go to the front door and the WebSocket to the bridge; both use the AWS services on the right.</text>
<text class="quiet" x="24" y="670" font-size="11.5">With the optional Flex add-on, Flex reads the redacted call timeline through the Context API.</text>
<text class="quiet" x="24" y="688" font-size="11.5">Not drawn: CloudWatch and X-Ray, and the optional AgentCore Runtime hosting of the bridge.</text>
