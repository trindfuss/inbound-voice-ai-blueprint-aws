<g class="edge" fill="none" stroke-width="1.25"><path d="M132 112V160" marker-end="url(#a)"/><path d="M224 188H280" marker-end="url(#a)"/><path d="M224 268H252V420H280" marker-end="url(#a)"/><path d="M224 492H252V580H280" marker-end="url(#a)"/><path d="M384 216V232" marker-end="url(#a)"/><path d="M384 304V320" marker-end="url(#a)"/><path d="M384 448V464" marker-end="url(#a)"/><path d="M500 188H512" marker-end="url(#a)"/><path d="M500 260H512" marker-end="url(#a)"/><path d="M500 332H512" marker-end="url(#a)"/><path d="M500 404H512" marker-end="url(#a)"/><path d="M500 492H512" marker-end="url(#a)"/><path d="M616 552V536" marker-end="url(#a)"/><path d="M488 268H500"/><path d="M488 500H500"/><path d="M500 188V500"/></g>
<rect class="edge" fill="none" stroke-width="1.25" x="24" y="72" width="216" height="40" rx="8"/>
